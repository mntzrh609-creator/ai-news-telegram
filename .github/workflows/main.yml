name: Telegram News Bot

on:
  schedule:
    # تشغيل كل 5 دقائق، طوال 24 ساعة
    - cron: "*/5 * * * *"

  # تشغيل يدوي عند الحاجة
  workflow_dispatch:

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المستودع
        uses: actions/checkout@v4

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: |
          pip install -r requirements.txt

      - name: تشغيل بوت الأخبار
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python main.py

      - name: حفظ سجل الأخبار
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json openai_state.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "لا توجد تغييرات للحفظ"
          else
            git commit -m "Update news state"
            git push
          fi
