name: Telegram News Bot

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

# يمنع تشغيلين متداخلين من الكتابة على seen_news.json في الوقت نفسه.
concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل نظام الأخبار
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py

      - name: حفظ سجل الأخبار المنشورة
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen_news.json

          if git diff --cached --quiet; then
            echo "ℹ️ لا يوجد تغيير في سجل الأخبار"
          else
            git commit -m "تحديث سجل الأخبار المنشورة"
            git push
          fi
