name: Telegram News Bot

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل الملفات
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: إعداد Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت المكتبات
        run: pip install -r requirements.txt

      - name: تشغيل نظام الأخبار
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python main.py

      - name: حفظ سجلات النظام
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f seen_news.json ]; then
            echo '{"version":3,"ids":[],"events":[]}' > seen_news.json
          fi

          if [ ! -f openai_state.json ]; then
            echo '{"last_attempt":null}' > openai_state.json
          fi

          git add seen_news.json openai_state.json

          if git diff --cached --quiet; then
            echo "ℹ️ لا يوجد تغيير في سجلات النظام"
          else
            git commit -m "تحديث سجلات بوت الأخبار"
            git push
          fi
